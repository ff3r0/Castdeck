[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castdeck"
version = "0.1.0"
description = "Visionneuse locale de sessions asciinema (exegol --log) : playlist, commandes, recherche plein texte."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyte>=0.8"]
keywords = ["asciinema", "exegol", "pentest", "terminal", "replay", "search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Logging",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
castdeck = "castdeck.cli:main"

[tool.setuptools]
packages = ["castdeck"]

[tool.setuptools.package-data]
castdeck = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
